version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # main은 의도적으로 typescript를 ^6에 고정한다 (commit f9ffd26).
      # typescript-eslint peer 요구와 충돌하므로 major 업그레이드를 무시한다 (#327).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # react 와 react-dom 은 버전이 함께 움직여야 한다. 따로 올라가면
      # peer 충돌로 설치 자체가 실패한다 (#357: react-dom 19.3.0 vs react 19.2.8).
      # @types/* 도 같이 묶는다 — 런타임 버전과 어긋나면 typecheck 가 깨진다.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
