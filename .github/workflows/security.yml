name: Security

# Supply-chain and secret checks (kpubdata-builder#691). Three questions, one job each:
#
#   dependency audit  does anything package-lock.json installs have a known vulnerability?
#   secret scan       does any commit in history carry a credential?
#   CodeQL            does the TypeScript source have a known-dangerous pattern?
#
# They run on every pull request and push to main, and weekly, because a dependency
# gains an advisory without anyone touching this repository. None is a required check:
# whether a new advisory should block every open pull request is a branch-protection
# decision (kpubdata#520).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"  # Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Reads package-lock.json against the registry advisory database; nothing is
      # installed. Dev dependencies included: they run in CI and on every laptop.
      - name: Audit the locked dependencies
        run: npm audit --package-lock-only --audit-level=low

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.28.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # history, not just the tip: a key removed later is still leaked

      # The checksum-verified binary rather than gitleaks-action, which needs a licence
      # key for organisations — a secret added in order to scan for secrets.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" "${base}/${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            | grep " ${archive}\$" | sha256sum -c -
          tar xzf "${archive}" gitleaks

      # Findings judged harmless are listed, with the reason, in .gitleaksignore.
      - name: Scan the full history
        run: ./gitleaks git . --redact --no-banner --log-level warn

  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
