name: Security

# Supply-chain and secret checks (kpubdata-builder#691). Three questions, one job each:
#
#   dependency audit  does anything package-lock.json installs have a known vulnerability?
#   secret scan       does any commit in history carry a credential?
#   CodeQL            does the TypeScript source have a known-dangerous pattern?
#
# They run on every pull request and push to main, and weekly, because a dependency
# gains an advisory without anyone touching this repository. None is a required check:
# whether a new advisory should block every open pull request is a branch-protection
# decision (kpubdata#520).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"  # Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# A pull request's new push replaces only that pull request's earlier run. Every other
# run — a merge to main above all — must finish and leave its result behind (#833), so
# it gets a group of its own: runs that share a group replace one another while they
# wait, whatever cancel-in-progress says, and a third push would cancel the second's
# run before it started (the same thing deploy.yml met in #586).
concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      # Reads package-lock.json against the registry advisory database; nothing is
      # installed. Dev dependencies included: they run in CI and on every laptop.
      - name: Audit the locked dependencies
        run: npm audit --package-lock-only --audit-level=low

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.28.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # history, not just the tip: a key removed later is still leaked

      # The checksum-verified binary rather than gitleaks-action, which needs a licence
      # key for organisations — a secret added in order to scan for secrets.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" "${base}/${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            | grep " ${archive}\$" | sha256sum -c -
          tar xzf "${archive}" gitleaks

      # Without --log-opts, gitleaks runs `git log --all`, which walks every ref
      # fetch-depth: 0 pulled in — including unmerged PR branches that have nothing
      # to do with this run (kpubdata-studio#685). Scope it to the commits this run
      # is actually responsible for.
      - name: Scope the scan to this run's own commits
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              # Only this PR's commits, base..head, so an unrelated open PR can't
              # fail this one.
              log_opts="${BASE_SHA}..${HEAD_SHA}"
              ;;
            push)
              if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
                # A new branch: no prior tip to diff against, so scan what the
                # branch brought in.
                log_opts="$PUSH_SHA"
              else
                log_opts="${BEFORE_SHA}..${PUSH_SHA}"
              fi
              ;;
            *)
              # schedule, workflow_dispatch: no run-specific range, so scan the
              # default branch's full history rather than every branch.
              log_opts="origin/${DEFAULT_BRANCH}"
              ;;
          esac
          echo "log-opts=${log_opts}" >> "$GITHUB_OUTPUT"

      # Findings judged harmless are listed, with the reason, in .gitleaksignore.
      - name: Scan the run's own commits
        run: ./gitleaks git . --redact --no-banner --log-level warn --log-opts="${{ steps.scope.outputs.log-opts }}"

  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          # Leaves test files out of the analysis; src/ stays fully scanned (#617).
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: /language:javascript-typescript
