name: CI

# PR 머지 전 프론트엔드 코드 품질 게이트: lint(ESLint) + type check(tsc) + 테스트(Vitest)
# + 프로덕션 빌드. 문서 배포 워크플로(docs.yml)와 분리된 코드 품질 전용 CI다 (#38).

on:
  pull_request:
  push:
    branches: [main]

# 최소 권한 원칙: 이 워크플로는 코드를 읽고 검사만 하므로 GITHUB_TOKEN에 읽기 권한만 부여한다.
# (의존성 설치 단계의 공급망 공격 시 피해 범위를 줄인다.)
permissions:
  contents: read

# A newer push to a pull request cancels the older run, which reports on a head that is
# no longer the pull request's. A run on main is never cancelled, and gets a group of its
# own: in a shared group a run waiting behind another is replaced by the next push and
# cancelled (#586), so every push to main keeps its own result and a failure names the
# commit that caused it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, type check, the source gates and the production build run once, on Node 22.
  # Their result does not depend on the Node version the suite runs on, so a second
  # copy on Node 24 bought nothing but runner time.
  static:
    name: Lint, type check, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      # 새 한국어 UI 문자열이 로케일을 거치지 않고 들어오는 걸 막는다 (#338).
      # 주석·mock 데이터·LLM 프롬프트는 세지 않으므로 기준선은 0이다.
      - name: i18n extraction gate
        run: npm run i18n:check

      # A `uses:` reference to another repository runs whatever its ref points at when
      # the job starts, so a branch or tag lets code reach the release and review gates
      # without a change here (#729). Every one must be a full commit SHA.
      - name: Action pin gate (#729)
        run: node scripts/check-action-pins.mjs

      # A key that no locale file has renders as the key itself, so the user reads
      # "layout.homeLink" where a label should be — nothing else in the build fails
      # on it (#448).
      - name: i18n key gate (#448)
        run: npm run i18n:keys

      # A Korean string with "run" or "provider" left in English, and an issue number
      # in a user string (#843). The first is a warning: the screen still works and a
      # quoted field name may be English on purpose. The second fails (baseline 0).
      - name: Korean screen terms (#843)
        run: node scripts/ko-mixed-terms.mjs --github

      # ADR 0003 (kpubdata) puts comments in English. The debt is at ZERO
      # (#427): any Korean comment now fails the build outright.
      - name: Korean comment gate (#427)
        run: python3 scripts/check_korean_ts_comments.py src e2e

      # Renaming a UI string without moving the assertions that name it (#429). The
      # values this branch removed from the locales are computed exactly, so there is
      # no guess about which literals are labels and no false positives.
      # checkout is depth 1, so the comparison base is fetched here.
      - name: Stale UI literal gate
        run: |
          git fetch --no-tags --depth=1 origin main || true
          npm run check:stale-ui

      - name: Build
        run: npm run build

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Node 20 은 빼야 한다. vitest 의 jsdom 경로가 undici 를 통해
        # ``webidl.util.markAsUncloneable`` 을 호출하고, 그 내부 API 는 Node 22
        # 부터 있다 — 20.20.2 에서 워커가 전부 기동에 실패한다(#400).
        #
        # 이것은 **개발 도구의 요구**이고 사용자 요구가 아니다. 배포 산출물은
        # 정적 빌드라 최종 사용자에게 Node 가 필요하지 않다. Node 20 을 유지하면
        # undici/jsdom/vitest 를 고정해야 하고, 그러면 보안 업데이트가 막힌다.
        #
        # The Node 22 leg is the only instrumented run: it owns the coverage gate (#380)
        # and the Builder contract drift check. The thresholds live in one place,
        # vitest.config.ts' coverage.thresholds.
        include:
          - node-version: "22"
            coverage: true
          - node-version: "24"
            coverage: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Studio's response schemas against Builder's contract (kpubdata-builder#693).
      # Builder main is what Studio is developed against and released with (ADR 0004).
      # A Builder enum value Studio does not accept makes every response carrying it
      # fail to parse — run_cancelled did, until #473 — so this fails the build instead.
      # When Builder cannot be checked out this step fails, and so does the leg.
      - name: Checkout Builder's contract
        if: matrix.coverage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: kpubdata-lab/kpubdata-builder
          path: .builder
          sparse-checkout: contract

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # With BUILDER_CONTRACT set, src/shared/lib/contractDrift.test.ts (and the
      # contract half of __tests__/publishIssueCodes.test.ts) run instead of skipping.
      # Run on its own first so a drift failure shows under this step's name; the
      # coverage step below runs the whole suite again, drift file included. A failed
      # Builder checkout fails the leg at the checkout step, as the drift job did.
      - name: Builder contract drift
        if: matrix.coverage
        env:
          BUILDER_CONTRACT: .builder/contract/builder-api.yaml
        run: npx vitest run src/shared/lib/contractDrift.test.ts

      # `!cancelled()` lets coverage report even when the drift step failed; the job
      # still fails because the drift step's own failure is not overridden.
      #
      # The thresholds are measured with the contract present, so the contract-only
      # paths count. `npm run test:coverage` without BUILDER_CONTRACT skips them and
      # reports slightly different figures; to reproduce this step locally, check out
      # kpubdata-builder's `contract/` directory and run
      #   BUILDER_CONTRACT=<builder>/contract/builder-api.yaml npm run test:coverage
      - name: Test with coverage and the Builder contract (Vitest)
        if: ${{ !cancelled() && matrix.coverage }}
        env:
          BUILDER_CONTRACT: .builder/contract/builder-api.yaml
        run: npm run test:coverage

      - name: Test (Vitest)
        if: ${{ !matrix.coverage }}
        run: npm test

  e2e:
    # Playwright 스펙을 CI 에 편입한다 (#377). 지금까지는 `npm run test:e2e` 를 사람이
    # 손으로 돌릴 때만 실행돼, 회귀를 잡아줄 수 있는 스펙이 사실상 놀고 있었다.
    #
    # 실 Builder 기동이 필요한 @real-builder 스펙은 playwright.config.ts 의 grep 이
    # 이미 걷어낸다 — 이 잡은 mock 모드 vite dev 서버만 띄운다(webServer 설정).
    #
    # The job runs in the Playwright image for the installed @playwright/test (#585), so
    # Chromium, its system libraries and fonts come from the image rather than from
    # whatever ubuntu-latest carries that week — the screenshot baselines (#532) are
    # rendered in the same image. Keep the tag equal to the package version;
    # __tests__/e2eContainerImage.test.ts fails when they drift apart.
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browsers are not downloaded: the image already holds them (PLAYWRIGHT_BROWSERS_PATH).
      - name: Run E2E
        run: npm run test:e2e
        env:
          # The container runs as root while Actions sets HOME to /github/home, which
          # root does not own; Playwright's CI recipe points HOME back at /root.
          HOME: /root

      # 실패 시 trace(playwright.config.ts 의 retain-on-failure)를 남겨야 CI 로그만
      # 보고 원인을 추측하지 않아도 된다.
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The release freeze (kpubdata #701, kpubdata docs/compatibility.md §5.1): while
  # main is frozen — from the release week's Monday until Studio ships in that week —
  # only release pull requests may merge. The action exits 0 when the freeze does not
  # apply (not a pull request, or not targeting main), so this job is never skipped
  # and the gate below keeps its meaning.
  release-freeze:
    name: Release freeze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: kpubdata-lab/kpubdata/.github/actions/release-freeze@807c21f6a78f22b6ed64e19b38585225ec95e1f7  # kpubdata-lab/kpubdata main
        with:
          github_token: ${{ github.token }}

  # One gate, so that editing the matrix is not also editing branch protection (#416).
  #
  # Requiring `Lint, type check, test, build (20)` is what blocked every PR after #413
  # removed Node 20 from the matrix: the context stopped being produced, and GitHub
  # waits for an absent check for ever. It is not a failure, so nothing reports it —
  # the PR simply never becomes mergeable, and the way past it is `--admin`, which
  # bypasses every other check too. A rule that blocks everything protects nothing.
  #
  # Depending on the matrix instead of naming its entries means a new Node version
  # is covered the moment it is added, and a removed one takes nothing with it.
  docker-csp:
    name: Docker CSP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build and verify the image's Content-Security-Policy
        run: bash scripts/docker-csp-smoke.sh

  # The strict docs build of deploy.yml, as a job the CI gate waits for (Refs #835):
  # deploy.yml's own run on pull requests is to be removed, and a broken docs site
  # should still not reach Pages. Both install requirements-docs.txt.
  docs:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [static, test, e2e, release-freeze, docker-csp, docs]
    # `always()` so a failed job still reaches this step. Without it the gate is
    # skipped when something upstream fails, and a skipped required check is the same
    # absence this job exists to remove.
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every job this gate covers must have succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::CI gate failed — upstream results were: ${results}"
              exit 1
            fi
          done
          echo "every upstream job succeeded"
