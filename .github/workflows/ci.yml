name: CI

# PR 머지 전 프론트엔드 코드 품질 게이트: lint(ESLint) + type check(tsc) + 테스트(Vitest)
# + 프로덕션 빌드. 문서 배포 워크플로(docs.yml)와 분리된 코드 품질 전용 CI다 (#38).

on:
  pull_request:
  push:
    branches: [main]

# 최소 권한 원칙: 이 워크플로는 코드를 읽고 검사만 하므로 GITHUB_TOKEN에 읽기 권한만 부여한다.
# (의존성 설치 단계의 공급망 공격 시 피해 범위를 줄인다.)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 은 빼야 한다. vitest 의 jsdom 경로가 undici 를 통해
        # ``webidl.util.markAsUncloneable`` 을 호출하고, 그 내부 API 는 Node 22
        # 부터 있다 — 20.20.2 에서 워커가 전부 기동에 실패한다(#400).
        #
        # 이것은 **개발 도구의 요구**이고 사용자 요구가 아니다. 배포 산출물은
        # 정적 빌드라 최종 사용자에게 Node 가 필요하지 않다. Node 20 을 유지하면
        # undici/jsdom/vitest 를 고정해야 하고, 그러면 보안 업데이트가 막힌다.
        node-version: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # npm이 runner-writable 경로 사용하도록 강제 설정
          npm_config_cache: ${{ runner.temp }}/.npm-cache
          npm_config_tmp: ${{ runner.temp }}/.npm-tmp

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      # 새 한국어 UI 문자열이 로케일을 거치지 않고 들어오는 걸 막는다 (#338).
      # 주석·mock 데이터·LLM 프롬프트는 세지 않으므로 기준선은 0이다.
      - name: i18n extraction gate
        run: npm run i18n:check

      # A key that no locale file has renders as the key itself, so the user reads
      # "layout.homeLink" where a label should be — nothing else in the build fails
      # on it (#448). Runs before the suite: it takes a second and names the file.
      - name: i18n key gate (#448)
        run: npm run i18n:keys

      # ADR 0003 (kpubdata) puts comments in English. The debt is at ZERO
      # (#427): any Korean comment now fails the build outright.
      - name: Korean comment gate (#427)
        run: python3 scripts/check_korean_ts_comments.py src e2e

      # Studio → Builder → KPubData: src/ may cite Builder's OpenAPI contract, never a
      # kpubdata or Builder source path, Python module, private constant or fixture
      # (#511). The quality job feeds the CI gate, so this step is required.
      - name: kpubdata boundary gate (#511)
        run: npm run check:boundary

      # Renaming a UI string without moving the assertions that name it (#429). The
      # values this branch removed from the locales are computed exactly, so there is
      # no guess about which literals are labels and no false positives.
      # checkout is depth 1, so the comparison base is fetched here.
      - name: Stale UI literal gate
        run: |
          git fetch --no-tags --depth=1 origin main || true
          npm run check:stale-ui

      - name: Test (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    # Playwright 스펙을 CI 에 편입한다 (#377). 지금까지는 `npm run test:e2e` 를 사람이
    # 손으로 돌릴 때만 실행돼, 회귀를 잡아줄 수 있는 스펙이 사실상 놀고 있었다.
    #
    # 실 Builder 기동이 필요한 @real-builder 스펙은 playwright.config.ts 의 grep 이
    # 이미 걷어낸다 — 이 잡은 mock 모드 vite dev 서버만 띄운다(webServer 설정).
    # 브라우저는 chromium 하나만 받는다: 두 project(desktop/mobile) 모두 chromium 이라
    # 나머지를 받아봐야 설치 시간만 늘어난다.
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_cache: ${{ runner.temp }}/.npm-cache
          npm_config_tmp: ${{ runner.temp }}/.npm-tmp

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      # 실패 시 trace(playwright.config.ts 의 retain-on-failure)를 남겨야 CI 로그만
      # 보고 원인을 추측하지 않아도 된다.
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  coverage:
    # 커버리지 게이트 (#380). 지금 도달한 수준이 조용히 내려가지 않게 잠근다.
    # 하한은 vitest.config.ts 의 coverage.thresholds 한 곳에서만 관리한다.
    # quality 잡은 Node 20/22 두 번 도는데, 계측을 거기 얹으면 같은 정보를 두 배
    # 비용으로 사게 된다 — 이 잡 하나만 계측한다.
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_cache: ${{ runner.temp }}/.npm-cache
          npm_config_tmp: ${{ runner.temp }}/.npm-tmp

      - name: Test with coverage
        run: npm run test:coverage

  contract-drift:
    # Studio's response schemas against Builder's contract (kpubdata-builder#693).
    # Builder main is what Studio is developed against and released with (ADR 0004).
    # A Builder enum value Studio does not accept makes every response carrying it
    # fail to parse — run_cancelled did, until #473 — so this fails the build instead.
    name: Builder contract drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Builder's contract
        uses: actions/checkout@v7
        with:
          repository: yeongseon/kpubdata-builder
          path: .builder
          sparse-checkout: contract

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_cache: ${{ runner.temp }}/.npm-cache
          npm_config_tmp: ${{ runner.temp }}/.npm-tmp

      - name: Compare schemas with the contract
        env:
          BUILDER_CONTRACT: .builder/contract/builder-api.yaml
        run: npx vitest run src/shared/lib/contractDrift.test.ts

  # One gate, so that editing the matrix is not also editing branch protection (#416).
  #
  # Requiring `Lint, type check, test, build (20)` is what blocked every PR after #413
  # removed Node 20 from the matrix: the context stopped being produced, and GitHub
  # waits for an absent check for ever. It is not a failure, so nothing reports it —
  # the PR simply never becomes mergeable, and the way past it is `--admin`, which
  # bypasses every other check too. A rule that blocks everything protects nothing.
  #
  # Depending on the matrix instead of naming its entries means a new Node version
  # is covered the moment it is added, and a removed one takes nothing with it.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [quality, e2e, coverage, contract-drift]
    # `always()` so a failed job still reaches this step. Without it the gate is
    # skipped when something upstream fails, and a skipped required check is the same
    # absence this job exists to remove.
    if: always()
    steps:
      - name: Every job this gate covers must have succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::CI gate failed — upstream results were: ${results}"
              exit 1
            fi
          done
          echo "every upstream job succeeded"
