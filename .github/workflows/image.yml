name: Image

# The Studio image on ghcr.io/kpubdata-lab/kpubdata-studio (#904), modelled on Builder's
# docker.yml. What each way in does:
#
#   pull_request                    builds both platforms with the SBOM and provenance a
#                                   publish attaches, pushes nothing, and starts the
#                                   image against a Builder image (a dry run)
#   workflow_call from release.yml  the same, then publishes the release tag (`ref`) and
#                                   starts the published image against a Builder
#
# A tag pushed with GITHUB_TOKEN does not fire `push: tags`, so release.yml calls this
# after it has tagged instead of waiting for an event.
#
# The Builder it is started against is built here from Builder's Dockerfile at the same
# ref — the release tag, or main on a pull request — rather than pulled from GHCR:
# Builder's image cannot be pulled anonymously, and whether Studio's runs may read it is
# not decided yet (#904).

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/docker-builder-smoke.sh"
      - ".github/workflows/image.yml"
      - ".github/workflows/release.yml"
  workflow_call:
    inputs:
      ref:
        description: "Release tag to build and publish, e.g. v0.5.0."
        required: true
        type: string
      publish:
        description: "Publish the image. release.yml sets it; a pull request never does."
        required: false
        type: boolean
        default: false
    outputs:
      digest:
        description: "The published image's digest; empty when nothing was published."
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read

concurrency:
  # A pull request's build is superseded by its next push; a release's run is never cut
  # off half-way, and one release tag is published by one run at a time.
  group: image-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.publish }}

jobs:
  build:
    name: Build and start against Builder
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The image tag comes from the release tag and the version inside from
      # package.json. release.yml writes the tag from package.json, so they agree; this
      # refuses a call where they do not, rather than label one version with another.
      - name: Version consistency
        if: inputs.ref != ''
        env:
          REF: ${{ inputs.ref }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${REF}" != "v${version}" ]; then
            echo "::error::asked to build ${REF}, but package.json says ${version}"
            exit 1
          fi
          echo "${REF} matches package.json"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Exactly what the publish job builds, without a registry: both platforms, the SBOM
      # and the provenance. A Dockerfile that does not build for arm64, or an attestation
      # that cannot be produced, fails here and not on release day.
      - name: Build both platforms (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
          sbom: true
          provenance: mode=max

      - name: Load the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: kpubdata-studio:smoke
          cache-from: type=gha,scope=publish

      - name: Checkout Builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: kpubdata-lab/kpubdata-builder
          ref: ${{ inputs.ref || 'main' }}
          path: .builder
          persist-credentials: false

      - name: Build the Builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .builder
          load: true
          push: false
          tags: kpubdata-builder:smoke
          cache-from: type=gha,scope=builder
          cache-to: type=gha,mode=max,scope=builder

      - name: Start the image against Builder
        env:
          STUDIO_IMAGE: kpubdata-studio:smoke
          BUILDER_IMAGE: kpubdata-builder:smoke
        run: bash scripts/docker-builder-smoke.sh

  publish:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: inputs.publish
    # The only job that writes to the registry. A called workflow's job gets no more
    # than the calling job grants: release.yml's `image` job.
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/kpubdata-lab/kpubdata-studio
          tags: |
            type=raw,value=${{ inputs.ref }}

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
          sbom: true
          provenance: mode=max

      - name: Print image digest
        env:
          REF: ${{ inputs.ref }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "Published ghcr.io/kpubdata-lab/kpubdata-studio:${REF} as ${DIGEST}"

  # The published image itself, pulled by digest, against Builder at the same tag.
  confirm:
    name: Start the published image against Builder
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: publish
    if: inputs.publish
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the published image
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: docker pull "ghcr.io/kpubdata-lab/kpubdata-studio@${DIGEST}"

      - name: Checkout Builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: kpubdata-lab/kpubdata-builder
          ref: ${{ inputs.ref }}
          path: .builder
          persist-credentials: false

      - name: Build the Builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .builder
          load: true
          push: false
          tags: kpubdata-builder:smoke
          cache-from: type=gha,scope=builder

      - name: Start the published image against Builder
        env:
          STUDIO_IMAGE: ghcr.io/kpubdata-lab/kpubdata-studio@${{ needs.publish.outputs.digest }}
          BUILDER_IMAGE: kpubdata-builder:smoke
        run: bash scripts/docker-builder-smoke.sh
