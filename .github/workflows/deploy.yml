name: Deploy demo + docs

# GitHub Pages에 두 가지를 함께 배포한다.
#   - 루트(/kpubdata-studio/)        : Studio 앱 데모 (mock 데이터 모드)
#   - /kpubdata-studio/docs/         : mkdocs 문서 사이트
# 앱은 VITE_USE_REAL_BUILDER를 설정하지 않으므로 라이브 Builder 없이 mock 데이터로 동작한다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pages deploys from main share one group and never cancel a deploy in progress.
# Every other run (pull request, manual dispatch) only builds, so it gets a group of its
# own ref: a pull request run waiting behind another run in the shared group was
# replaced and cancelled with no job, and `build` is a required check, so the pull
# request stayed BLOCKED (#586). A newer push to the same pull request still cancels
# the older one's run, which reports on a head that is no longer the pull request's.
concurrency:
  group: ${{ github.event_name == 'push' && 'pages' || format('pages-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --- Studio 앱(데모) 빌드: dist/ 루트 ---
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          # npm이 runner-writable 경로 사용하도록 강제 설정
          npm_config_cache: ${{ runner.temp }}/.npm-cache
          npm_config_tmp: ${{ runner.temp }}/.npm-tmp
      - run: npm run build # base=/kpubdata-studio/, mock 모드(실 Builder 미설정)

      # --- 문서 빌드: site/ ---
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict

      # --- 배포 아티팩트 합치기: 앱은 루트, 문서는 /docs ---
      - name: Combine app + docs into publish dir
        run: |
          mkdir -p dist/docs
          cp -r site/. dist/docs/
          # SPA(history 라우팅) 새로고침/딥링크 대응: 알 수 없는 경로를 index.html로 폴백
          cp dist/index.html dist/404.html
          # Jekyll 처리 비활성화(_로 시작하는 에셋 무시 방지)
          touch dist/.nojekyll

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
