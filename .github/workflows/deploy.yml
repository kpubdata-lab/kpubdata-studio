name: Deploy demo + docs

# GitHub Pages에 두 가지를 함께 배포한다.
#   - 루트(/kpubdata-studio/)        : Studio 앱 데모 (mock 데이터 모드)
#   - /kpubdata-studio/docs/         : mkdocs 문서 사이트
# 앱은 VITE_USE_REAL_BUILDER를 설정하지 않으므로 라이브 Builder 없이 mock 데이터로 동작한다.

# Not on a pull request (#835): ci.yml's `static` (the app build) and `docs`
# (mkdocs --strict) hold a pull request to the same two builds, behind the `CI gate`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pages deploys from main share one group and never cancel a deploy in progress. A
# manual dispatch only builds, so it gets a group of its own ref and does not wait
# behind, or replace, a deploy (#586).
concurrency:
  group: ${{ github.event_name == 'push' && 'pages' || format('pages-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # --- Studio 앱(데모) 빌드: dist/ 루트 ---
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
      - run: npm run build # base=/kpubdata-studio/, mock 모드(실 Builder 미설정)

      # --- 문서 빌드: site/ ---
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # mkdocs and mkdocs-material at exact versions, the same file ci.yml's `docs` job
      # installs, so a new release of either cannot fail --strict on a pull request that
      # did not touch the docs. What those two depend on (pymdown-extensions among them)
      # is not pinned and can still move. Dependabot raises the two.
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict

      # --- 배포 아티팩트 합치기: 앱은 루트, 문서는 /docs ---
      - name: Combine app + docs into publish dir
        run: |
          mkdir -p dist/docs
          cp -r site/. dist/docs/
          # SPA(history 라우팅) 새로고침/딥링크 대응: 알 수 없는 경로를 index.html로 폴백
          cp dist/index.html dist/404.html
          # Jekyll 처리 비활성화(_로 시작하는 에셋 무시 방지)
          touch dist/.nojekyll

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
