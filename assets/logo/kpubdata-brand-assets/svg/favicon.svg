<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Brand v2 minimal K (#628). Geometry is on a 64x64 unit grid; every vertex is an
     integer that is a multiple of 4 except the hidden underlap row (y=26), so the mark is
     pixel-aligned at 16, 32 and 64 px. Glyph box: x 8-56, y 8-56 (48x48), centred.
       stem        x 8-20, y 8-56            (12 wide)               Brand Blue
       upper arm   (24,32) (40,8) (56,8) (40,32)                     Data Cyan
       lower arm   (24,32) (40,32) (56,56) (40,56)                   Fresh Mint
     Arms: 16 units wide horizontally, ~13.3 perpendicular, slope 24:16.
     Gap between stem and arm tip: 4 units (1 px at 16 px). The lower arm starts 6 units
     under the upper one so no background seam shows where they meet. Flat fills only. -->
<path d="M8 8H20V56H8Z" fill="#2563EB"/><path d="M24 32L28 26H44L40 32L56 56H40Z" fill="#14B8A6"/><path d="M24 32L40 8H56L40 32Z" fill="#06B6D4"/>
</svg>
