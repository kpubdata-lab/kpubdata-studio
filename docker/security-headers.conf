# Sent with every response (#841). Included in each location of nginx.conf: add_header in
# a location replaces the server's, so a header set once at the server would be dropped
# wherever a location sets one of its own.

# A link out of Studio tells the other site the origin and nothing of the page it came
# from: paths here carry run ids and table names.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Studio uses none of these, so no script in the page — its own or an injected one — can
# ask for them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Come back over HTTPS for a year. This server speaks HTTP behind whatever terminates TLS,
# and a browser ignores the header on a plain-HTTP response, so it takes effect only where
# the deployment is served over HTTPS. Subdomains are not included: whether the names
# beside this one are all HTTPS is the deployment's to say, at its proxy.
add_header Strict-Transport-Security "max-age=31536000" always;
