# Static Studio behind nginx (#411). The unprivileged base image listens on 8080.

# A hashed bundle is kept for a year only when it was found (#868). A 404 under /assets/
# is answered no-store: right after a deployment a browser can ask for a hash that is
# gone, or for one not served yet, and a 404 cached for a year would outlive the file.
# This file is included in the http context (conf.d), where map belongs.
map $status $kpubdata_assets_cache_control {
    200     "public, max-age=31536000, immutable";
    206     "public, max-age=31536000, immutable";
    304     "public, max-age=31536000, immutable";
    default "no-store";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The Server header and nginx's own error pages say "nginx" without its version
    # (#994): the version tells a scanner which advisories to try and nobody else anything.
    server_tokens off;

    # Text is compressed on the way out (#994). The bundle budget in
    # scripts/check-bundle-size.mjs is measured gzipped, and without this a browser
    # downloaded every bundle at its full size. Only text types are listed: images other
    # than SVG and woff2 fonts are compressed already, and compressing them again costs
    # CPU and saves nothing. text/html is always compressed once gzip is on. Vary tells a
    # cache in between that the body depends on Accept-Encoding; gzip_proxied any keeps a
    # request that came through a proxy (a Via header) from being sent uncompressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # add_header in a location replaces the server's, so each location sets its own —
    # and includes the headers every response carries (security-headers.conf, #841).

    # Hashed bundles never change under the same name; a missing one is not cached (#868).
    location /assets/ {
        add_header Cache-Control $kpubdata_assets_cache_control always;
        add_header X-Content-Type-Options nosniff always;
        include /etc/nginx/kpubdata-security-headers.conf;
        try_files $uri =404;
    }

    # Rewritten per container start, so a cached copy would be the last deployment's.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        include /etc/nginx/kpubdata-security-headers.conf;
    }

    # Keycloak's silent SSO check loads this in a hidden iframe. Its one inline script is
    # allowed by hash and nothing else is (#663); __tests__/contentSecurityPolicy.test.ts
    # fails if the script changes without this hash.
    location = /silent-check-sso.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        include /etc/nginx/kpubdata-security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-0zZPgsifJ8h8aM+gmSxkrfNtAGUZb7ItVug6/j1UR5g='; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    }

    # Client-side routes: every unknown path is the app. index.html is not cached so
    # a new release is picked up on the next load (#430). The Content-Security-Policy
    # header is written at container start with this deployment's Builder and OIDC
    # origins (40-kpubdata-config.sh, #663).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        include /etc/nginx/kpubdata-security-headers.conf;
        include /etc/nginx/kpubdata-csp.conf;
        try_files $uri $uri/ /index.html;
    }
}
