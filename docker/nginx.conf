# Static Studio behind nginx (#411). The unprivileged base image listens on 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # add_header in a location replaces the server's, so each location sets its own.

    # Hashed bundles never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Rewritten per container start, so a cached copy would be the last deployment's.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Client-side routes: every unknown path is the app. index.html is not cached so
    # a new release is picked up on the next load (#430).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }
}
