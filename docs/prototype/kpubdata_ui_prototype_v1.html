span><span class="badge b-success">PASS</span></span><span>0.2%</span><span>within threshold</span><span><button class="btn ghost" onclick="go('preview')">Preview</button></span></div></div>`}

xt.region} · ${b.context.period}`:'BuildSpec 기준'}</b></div><div class="status-row"><span>Preview snapshot</span><b>${b.context?.preview||'—'}</b></div><div class="status-row"><span>Output</span><b>${b.context?.output||'Artifact 기준'}</b></div><div class="status-row"><span>Source</span><b>${b.context?.source||b.provider}</b></div></div></div><div class="section-title">Pipeline progress</div><div class="stage-flow">${pipelineFor(b)}</div><div class="section-title">Run log</div><div class="log">${b.log.join('\n')}</div><div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="go('buildspec')">BuildSpec 수정</button><button class="btn secondary" onclick="openBuildAssistant()">AI 원인 분석</button><button class="btn primary" onclick="showToast('재실행을 시작했습니다.')">재실행</button></div></div></div>`) }
function pipelineFor(b){const stages=['Source','Bronze','Validate','Silver','Validate','Gold','Artifact'];if(b.status==='Success')return stages.map((s,i)=>`${i?'<span class="arrow">→</span>':''}<div class="stage-box done"><small>${s}</small><b>Done</b></div>`).join('');if(b.status==='Running'){const runAt=Number.isInteger(b.runAt)?b.runAt:3;return stages.map((s,i)=>`${i?'<span class="arrow">→</span>':''}<div class="stage-box ${i<runAt?'done':i===runAt?'run':''}"><small>${s}</small><b>${i<runAt?'Done':i===runAt?'Running':'Pending'}</b></div>`).join('')}const failAt=Number.isInteger(b.failAt)?b.failAt:4;return stages.map((s,i)=>`${i?'<span class="arrow">→</span>':''}<div class="stage-box ${i<failAt?'done':i===failAt?'fail':''}"><small>${s}</small><b>${i<failAt?'Done':i===failAt?'Failed':'Blocked'}</b></div>`).join('')}

function assistantActionButtons(c){if(c.quality==='PROVIDER ERROR')return `<button onclick="go('provider')">Provider 설정 보기</button><button onclick="go('builds')">Run 보기</button><button onclick="addAssistantToReport()">보고서에 추가</button>`;if(c.quality==='RUNNING')return `<button onclick="go('builds')">Build 진행 보기</button><button onclick="showToast('Running Build가 완료된 뒤 수정 Action을 사용할 수 있습니다.')">수정 Action 대기</button>`;if(c.build==='—')return `<button onclick="go('discover')">데이터 탐색</button><button onclick="go('datasets')">Dataset Catalog</button>`;return `<button onclick="applyAssistantRuleDraft()">BuildSpec에 반영</button><button onclick="go('quality')">Quality 보기</button><button onclick="addAssistantToReport()">보고서에 추가</button>`}
function assistantContent(compact=false){const c=currentContext();if(!state.assistantOnboarded)return `<div class="onboarding"><div class="eyebrow" style="color:var(--primary)">ASSISTANT ONBOARDING</div><h3>처음이신가요?</h3><div class="tiny">최초 1회만 표시됩니다. 예시 질문으로 시작하거나 직접 질문할 수 있습니다.</div><div class="chips">${['이 데이터셋 품질 어때?','실패한 Build 원인 알려줘','이 데이터로 어떤 분석 가능해?'].map(q=>`<button class="chip" onclick="completeAssistantOnboarding('${q}')">${q}</button>`).join('')}</div></div>`;return `<div class="${compact?'':'assistant-layout'}"><div><div class="context-bar"><div class="context-cell"><small>DATASET</small><b>${c.dataset}</b></div><div class="context-cell"><small>BUILD</small><b>${c.build}</b></div><div class="context-cell"><small>STAGE</small><b>${c.stage}</b></div><div class="context-cell"><small>QUALITY</small><b>${c.quality}</b></div></div><div class="chat"><div class="bubble user" id="promptSeed">${state.assistantPrompt}</div><div class="bubble ai">${c.note}<div class="evidence"><b>Evidence</b> · ${c.evidence}</div><div class="section-title" style="margin-top:10px">AI Generated SQL <span class="tiny" style="font-weight:400">· 질문을 해석해 생성한 조회 쿼리</span></div><div class="code">${c.sql}</div><div class="actions" style="margin-top:8px"><span class="tiny">Data source · ${c.provider==='—'?'선택된 데이터 없음':c.provider} · Read-only</span><button class="btn ghost" onclick="showToast('Generated SQL을 복사했습니다.')">SQL 복사</button></div><div class="section-title" style="margin-top:10px">Result preview</div><div class="mini-chart"><i style="height:28%"></i><i style="height:43%"></i><i class="warn" style="height:78%"></i><i style="height:51%"></i><i style="height:36%"></i></div><div class="ai-actions">${assistantActionButtons(c)}</div></div></div></div>${compact?'':`<div class="card soft"><div class="section-title">추천 질문</div><div class="chips"><button class="chip" onclick="openPrompt('지역별 결측 분포를 보여줘.')">지역별 결측 분포?</button><button class="chip" onclick="openPrompt('현재 Build를 다시 실행해도 되는지 판단해줘.')">Build 다시 돌려도 될까?</button><button class="chip" onclick="openPrompt('현재 데이터와 함께 활용할 관련 데이터셋을 추천해줘.')">관련 데이터 추천</button></div><div class="divider"></div><div class="section-title">관련 데이터셋</div><div class="status-list"><div class="status-row"><span>한국은행 기준금리</span><b>ECOS</b></div><div class="status-row"><span>기상 관측</span><b>KMA</b></div></div></div>`}</div>`}
function assistant(){return appShell('assistant',`<div class="page-head"><div><h1>Assistant · AI Data Copilot</h1><p>현재 화면·Dataset·Build·Quality 문맥을 사용해 다음 Action까지 연결합니다.</p></div></div>${assistantContent(false)}`)}
function reports(){const ref=state.reportNotes.length?state.reportNotes[state.reportNotes.length-1]:null;return appShell('reports',`<div class="page-head"><div><h1>Report Agent</h1><p>Gold #1042를 기준 보고서로 유지하고, Assistant에서 추가한 다른 Build 분석은 참고 이력으로 구분합니다.</p></div><div class="actions"><button class="btn secondary" onclick="showToast('편집 모드로 전환했습니다.')">${icon('edit')} 편집</button><button class="btn primary" onclick="showToast('보고서를 내보냈습니다.')">${icon('download')} 내보내기</button></div></div><div class="report-layout"><div class="card" style="padding:0"><div class="editor-toolbar"><button>B</button><button>I</button><button>H1</button><button>H2</button><button>• List</button><button>Quote</button></div><div class="report-doc"><div class="eyebrow" style="color:var(--primary)">AI-ASSISTED DATA REPORT</div><h2>데이터 품질·활용 보고서</h2><div class="tiny">2026 H1 아파트 실거래가 · Gold · Build #1042</div><h3>1. 데이터 개요</h3><p>1.24M rows · 17 columns · data.go.kr</p><h3>2. 처리 흐름</h3><p>Source → Bronze → Validate → Silver → Validate → Gold</p><h3>3. 품질 진단</h3><ul><li>4/5 checks passed</li><li>price 결측 1.8% WARN</li><li>Duplicate 0.2% PASS</li></ul><h3>4. 활용 아이디어</h3><p>지역·기간별 가격 분포와 기준금리 결합 분석을 고려할 수 있습니다.</p>${state.reportNotes.length?state.reportNotes.map(n=>`<div class="callout"><b>Assistant reference · ${n.build} · ${n.stage}</b><div class="tiny" style="margin-top:4px">${n.dataset} · 기준 보고서 #1042와 별도의 참고 분석</div><div style="margin-top:6px">${n.note}</div></div>`).join(''):'<div class="callout" style="background:#f8fafc;color:#667085;border-color:#e5e7eb">Assistant 분석에서 <b>보고서에 추가</b>를 누르면 이 위치에 참고 분석 블록이 추가됩니다.</div>'}<h3>5. 한계 및 주의사항</h3><p>결측 처리 전후 분포와 원천 데이터 갱신주기, 라이선스 조건을 함께 기록합니다.</p></div></div><div><div class="card"><div class="section-title">Report Context</div><div class="status-list"><div class="status-row"><span>Base Dataset</span><b>아파트 실거래가</b></div><div class="status-row"><span>Base Build</span><b>#1042 · Gold</b></div><div class="status-row"><span>Quality</span><b>4/5 · 1 WARN</b></div>${ref?`<div class="status-row"><span>Assistant Reference</span><b>${ref.build} · ${ref.stage}</b></div>`:''}</div></div><div class="card" style="margin-top:14px"><div class="section-title">AI 분석 옵션</div><div class="status-list"><div class="status-row"><span>Quality summary</span><b>ON</b></div><div class="status-row"><span>Schema drift</span><b>ON</b></div><div class="status-row"><span>Lineage</span><b>ON</b></div><div class="status-row"><span>Analysis ideas</span><b>ON</b></div></div><div class="divider"></div><div class="section-title">주요 인사이트</div><div class="tiny">price 결측 1.8%가 특정 지역에 집중되는지 확인이 필요합니다.</div></div></div></div>`) }
function settings(){return appShell('settings',`<div class="page-head"><div><h1>Settings</h1><p>계정, 프로젝트, Credential 환경을 관리합니다.</p></div></div><div class="grid equal-two"><div class="card"><div class="section-title">계정 / 프로젝트</div><div class="field"><label>이름</label><input class="input" value="LS"/></div><div class="field"><label>기본 프로젝트</label><input class="input" value="kpubdata demo"/></div><button class="btn primary" onclick="showToast('Settings를 저장했습니다.')">저장</button></div><div class="card"><div class="section-title">Credential</div><div class="status-list"><div class="status-row"><span>data.go.kr</span><b>•••••••• · 연결됨</b></div><div class="status-row"><span>KOSIS</span><b>미등록</b></div></div><button class="btn secondary" style="margin-top:12px" onclick="go('provider')">Provider 설정</button></div></div>`)}
function monitoring(){const system=state.monitorTab==='system';return appShell('monitoring',`<div class="page-head"><div><h1>Monitoring</h1><p>현재 시스템 리소스와 최근 Build 동작을 분리해서 확인합니다.</p></div></div><div class="monitor-tabs"><button class="monitor-tab ${system?'active':''}" onclick="state.monitorTab='system';render()">시스템 리소스</button><button class="monitor-tab ${!system?'active':''}" onclick="state.monitorTab='build';render()">Build 통계</button></div>${system?`<div class="grid monitor-grid"><div class="card metric"><div class="label"><span class="dot ok"></span>BUILDER API</div><div class="value" style="font-size:20px">Healthy</div><div class="sub">p95 182 ms</div></div><div class="card metric"><div class="label"><span class="dot ok"></span>QUEUE</div><div class="value" style="font-size:20px">${state.previewBuildStarted?'4':'3'} jobs</div><div class="sub">대기 2 · Running ${state.previewBuildStarted?'2':'1'}</div></div><div class="card metric"><div class="label"><span class="dot warn"></span>WORKERS</div><div class="value" style="font-size:20px">3 / 4</div><div class="sub">75% 사용 중</div><div class="resource-bar"><i style="width:75%"></i></div></div><div class="card metric"><div class="label"><span class="dot ok"></span>ARTIFACT STORE</div><div class="value" style="font-size:20px">Normal</div><div class="sub">최근 write 성공</div></div></div><div class="grid equal-two" style="margin-top:14px"><div class="card"><div class="section-title">Component status</div><div class="status-list"><div class="status-row"><span>Builder API</span><b class="badge b-success">Normal</b></div><div class="status-row"><span>Queue</span><b class="badge b-success">Normal</b></div><div class="status-row"><span>Workers</span><b class="badge b-warn">Warning</b></div><div class="status-row"><span>Artifact Store</span><b class="badge b-success">Normal</b></div></div></div><div class="card"><div class="section-title">Provider / API status</div><div class="status-list"><div class="status-row"><span>data.go.kr</span><b class="badge b-success">Normal</b></div><div class="status-row"><span>Usage / Limit</span><b>미제공</b></div><div class="status-row"><span>KMA</span><b class="badge b-success">Normal</b></div><div class="status-row"><span>TAAS</span><b class="badge b-warn">Warning</b></div></div><div class="callout" style="margin-top:10px">TAAS 응답 지연 증가 · <a class="link" href="#" onclick="state.selectedBuild='#1039';go('builds')">관련 Build 보기 →</a></div></div></div>`:`<div class="grid equal-two"><div class="card"><div class="section-title">시간대별 Build</div><div class="activity-bars"><span data-label="09" style="height:34%"></span><span data-label="10" style="height:58%"></span><span data-label="11" style="height:74%"></span><span data-label="12" style="height:47%"></span><span data-label="13" style="height:65%"></span><span class="fail" data-label="14" style="height:24%"></span></div></div><div class="card"><div class="section-title">최근 Runs</div>${buildMini()}</div></div>`}`)}
function openAssistant(prompt,skipOnboarding=true){if(prompt)state.assistantPrompt=prompt;if(skipOnboarding)state.assistantOnboarded=true;const d=document.getElementById('assistantDrawer');d.classList.remove('hidden');renderDrawer()}
function openBuildAssistant(){const b=builds[state.selectedBuild]||builds['#1043'];openAssistant(`${state.selectedBuild} ${b.stage} 단계 ${b.status} 원인과 수정 방법을 분석해줘.`,true)}
function completeAssistantOnboarding(q){state.assistantOnboarded=true;state.assistantPrompt=q;render();if(!document.getElementById('assistantDrawer').classList.contains('hidden'))renderDrawer()}
function toggleAssistant(fromSearch=false){const d=document.getElementById('assistantDrawer');const willOpen=d.classList.contains('hidden');d.classList.toggle('hidden');if(willOpen&&fromSearch&&state.assistantOnboarded)state.assistantPrompt='필요한 공공데이터를 자연어로 질문해보세요.';if(willOpen)renderDrawer()}
function renderDrawer(){const d=document.getElementById('assistantDrawer');d.innerHTML=`<div class="drawer-head"><b>${icon('spark')} Assistant</b><span class="tiny">현재 화면 문맥 기반</span><button class="drawer-close" onclick="toggleAssistant(false)">×</button></div><div class="drawer-content">${assistantContent(true)}</div>`}
function go(s){state.screen=s;if(s==='detail')state.detailTab='overview';render();window.scrollTo(0,0)}
function render(){let html='';switch(state.screen){case'login':html=auth('login');break;case'signup':html=auth('signup');break;case'home':html=home();break;case'discover':html=discover();break;case'workspace':html=workspace();break;case'add':html=addData();break;case'datasets':html=datasets();break;case'detail':html=detail();break;case'quality':html=quality();break;case'builds':html=buildsPage();break;case'assistant':html=assistant();break;case'reports':html=reports();break;case'monitoring':html=monitoring();break;case'provider':html=provider();break;case'buildspec':html=buildspec();break;case'preview':html=preview();break;case'settings':html=settings();break;default:html=home()}document.getElementById('prototype').innerHTML=html;if(!document.getElementById('assistantDrawer').classList.contains('hidden'))renderDrawer()}
render();renderDrawer();
</script>
</body>
</html>
